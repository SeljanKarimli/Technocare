name: Technocare CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      production_smoke:
        description: Run smoke tests against deployed production endpoints
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    name: ASP.NET Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore backendMAIN.Tests/backendMAIN.Tests.csproj
      - run: dotnet build backendMAIN.Tests/backendMAIN.Tests.csproj --configuration Release --no-restore
      - run: dotnet test backendMAIN.Tests/backendMAIN.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage"

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: t_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-warnings
      - run: flutter test --coverage
      - run: flutter build web --release --dart-define=API_BASE_URL=https://api.technocare.az/api
      - run: flutter build apk --debug --dart-define=API_BASE_URL=https://api.technocare.az/api
      - run: >-
          flutter build appbundle --release
          --dart-define=API_BASE_URL=https://api.technocare.az/api
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_ANDROID_APP_ID=${{ secrets.FIREBASE_ANDROID_APP_ID }}
      - name: Prevent unsigned CI bundle from being published
        run: echo "GitHub Actions validates the Android release build only. Download signed release bundles from Codemagic."

  flutter-ios:
    name: Flutter iOS build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: t_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL=https://api.technocare.az/api
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_IOS_APP_ID=${{ secrets.FIREBASE_IOS_APP_ID }}

  wordpress-plugin:
    name: WordPress plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - run: php -l wordpress/technocare-app-api/technocare-app-api.php
      - run: php wordpress/technocare-app-api/tests/project-parser-smoke.php
      - run: php wordpress/technocare-app-api/tests/search-normalization-smoke.php
      - name: Package deployable plugin
        run: zip -r technocare-app-api.zip wordpress/technocare-app-api -x "*/tests/*"
      - uses: actions/upload-artifact@v4
        with:
          name: technocare-app-api
          path: technocare-app-api.zip
      - name: Reject insecure production client overrides
        shell: bash
        run: |
          ! grep -R "badCertificateCallback\|HttpOverrides.global\|technocareapi.runasp.net" t_app/lib backendMAIN --exclude-dir=bin --exclude-dir=obj

  production-smoke:
    name: Deployed endpoint smoke test
    if: github.event_name == 'workflow_dispatch' && inputs.production_smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke-production.sh
        env:
          API_BASE_URL: https://api.technocare.az/api
          WORDPRESS_BASE_URL: https://technocare.az/wp-json/technocare-app/v1
