<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technocare Admin Panel - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            max-width: 420px;
            width: 100%;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #333;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .login-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 15px;
        }

        .form-control {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .input-group-text {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-right: none;
        }

        .form-control:focus + .input-group-text,
        .input-group-text + .form-control:focus {
            border-color: #667eea;
        }

        .alert {
            border-radius: 8px;
            font-size: 14px;
        }

        .loading-spinner {
            display: none;
        }

        .btn-login.loading .loading-spinner {
            display: inline-block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        .remember-me {
            font-size: 14px;
            color: #666;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="login-header">
                <div class="login-icon">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h2>Admin Panel</h2>
                <p>Technocare Management System</p>
            </div>

            <form id="login-form">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" class="form-control" id="email" required
                               placeholder="admin@technocare.az" value="info@technocare.az">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-key"></i>
                        </span>
                        <input type="password" class="form-control" id="password" required
                               placeholder="••••••••">
                        <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember-me">
                    <label class="form-check-label remember-me" for="remember-me">
                        Remember me
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-login w-100" id="login-btn">
                    <span class="btn-text">Sign In</span>
                    <span class="loading-spinner">
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                        Signing in...
                    </span>
                </button>
            </form>

            <div id="message-box" class="mt-3 alert d-none" role="alert"></div>

            <div class="footer-text">
                <p>© 2024 Technocare. All rights reserved.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // Hardcoded admin credentials
        const ADMIN_CREDENTIALS = {
            email: 'info@technocare.az',
            password: 'aA12345678!'
        };

        function showMessage(message, type = 'danger') {
            const messageBox = document.getElementById('message-box');
            messageBox.textContent = message;
            messageBox.className = `mt-3 alert alert-${type}`;
            messageBox.classList.remove('d-none');

            // Auto hide success messages
            if (type === 'success') {
                setTimeout(() => {
                    messageBox.classList.add('d-none');
                }, 3000);
            }
        }

        function getApiBase() {
            const host = window.location.hostname.toLowerCase();
            if (host === 'localhost' || host === '127.0.0.1') {
                return window.location.origin;
            }
            return 'https://technocareapi.runasp.net';
        }

        // Toggle password visibility
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        });

        // Check for existing session
        function checkExistingSession() {
            const adminUser = localStorage.getItem('adminUser');
            const adminToken = localStorage.getItem('adminToken');

            if (adminUser && adminToken) {
                try {
                    const user = JSON.parse(adminUser);
                    // Just check if we have a valid session, don't verify email
                    if (user.role === 'Admin') {
                        // Valid session exists, redirect to admin panel
                        window.location.replace('admin.html');
                        return true;
                    }
                } catch (e) {
                    // Invalid session data, clear it
                    localStorage.removeItem('adminUser');
                    localStorage.removeItem('adminToken');
                }
            }
            return false;
        }

        // Check session on page load
        window.addEventListener('load', function() {
            if (checkExistingSession()) {
                // Already redirected, stop execution
                return;
            }
        });

        // Handle login form submission
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');
            const rememberMe = document.getElementById('remember-me').checked;

            // Validate credentials against hardcoded values
            if (email !== ADMIN_CREDENTIALS.email || password !== ADMIN_CREDENTIALS.password) {
                showMessage('Invalid email or password. Please try again.', 'danger');
                return;
            }

            // Show loading state
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                const API_BASE = getApiBase();

                // Try to authenticate with backend
                const response = await axios.post(`${API_BASE}/api/auth/login`, {
                    email: email,
                    password: password
                });

                const data = response.data;

                // Store admin session (we already validated credentials above)
                const token = data.token || data.Token;
                const adminUser = {
                    id: data.id || data.Id,
                    name: data.name || data.Name,
                    email: data.email || data.Email,
                    role: 'Admin', // Force admin role
                    loginTime: new Date().toISOString()
                };

                localStorage.setItem('adminToken', token);
                localStorage.setItem('adminUser', JSON.stringify(adminUser));

                // Set session expiration if not remembering
                if (!rememberMe) {
                    setTimeout(() => {
                        localStorage.removeItem('adminToken');
                        localStorage.removeItem('adminUser');
                    }, 24 * 60 * 60 * 1000); // 24 hours
                }

                showMessage('Login successful! Redirecting...', 'success');

                // Redirect to admin panel
                setTimeout(() => {
                    window.location.replace('admin.html');
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);

                // If backend is unavailable, allow local admin access
                if (error.code === 'ERR_NETWORK' || error.code === 'ECONNREFUSED') {
                    showMessage('Backend unavailable. Using local admin mode.', 'warning');

                    // Create local admin session
                    const adminUser = {
                        id: 'local-admin',
                        name: 'Administrator',
                        email: ADMIN_CREDENTIALS.email,
                        role: 'Admin',
                        loginTime: new Date().toISOString(),
                        localMode: true
                    };

                    localStorage.setItem('adminToken', 'local-admin-token');
                    localStorage.setItem('adminUser', JSON.stringify(adminUser));

                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 1500);
                } else {
                    const errorMessage = error.response?.data?.message || 'Login failed. Please try again.';
                    showMessage(errorMessage, 'danger');
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                }
            }
        });

        // Add enter key support for password field
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('login-form').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
