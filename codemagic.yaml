workflows:
  technocare-android-bundle:
    name: Technocare Android App Bundle
    # Personal accounts receive free build minutes on the macOS M2 runner.
    # Linux X2 requires billing to be enabled.
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: t_app
    environment:
      flutter: stable
      java: 17
      vars:
        API_BASE_URL: https://api.technocare.az/api
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: codex/live-shop
          include: true
          source: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze Flutter source
        script: flutter analyze --fatal-warnings
      - name: Run Flutter tests
        script: flutter test
      - name: Build Android App Bundle
        script: >-
          flutter build appbundle --release
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"
          --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
          --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID"
          --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID"
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
      - flutter_drive.log
